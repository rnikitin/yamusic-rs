# Каждый push и PR: clippy, тесты и артефакты (Windows exe + macOS .app).
# Тег v* (например v1.0.2): релиз GitHub с yamusic-rs.exe и yamusic-rs-macos-universal.zip.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: target/release/yamusic-rs.exe

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Собрать universal .app (arm64 + x86_64) и упаковать в zip
        env:
          MACOS_UNIVERSAL: "1"
        run: |
          tools/make_app.sh
          ditto -c -k --keepParent target/release/yamusic-rs.app yamusic-rs-macos-universal.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: yamusic-rs-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" \
            dist/yamusic-rs.exe dist/yamusic-rs-macos-universal.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --generate-notes
